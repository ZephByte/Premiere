# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties (per-MC-version properties like minecraft_version and
# fabric_version live in fabric/versions/<version>/gradle.properties)
loader_version=0.19.3
kotlin_loader_version=1.13.12+kotlin.2.4.0
# Mod Properties. Release tags add a leading "v"; artifacts use SemVer without
# that prefix and get +<mc> / +paper suffixes per target.
mod_version=1.0.0-beta.1
maven_group=dev.zephbyte
archives_base_name=Premiere

# Publishing. Fill the IDs once the Modrinth/CurseForge projects exist —
# publishMods dry-runs (no upload) while modrinth_id is blank or no token
# is set. modrinth_versions is the union of supported MC versions and
# feeds the Paper file's version list; extend it when adding versions.
modrinth_versions=26.2
modrinth_id=
curseforge_id=

# Paper (plugin API; the plugin itself is version-flexible Bukkit API only)
paper_api_version=26.2.build.84-stable
