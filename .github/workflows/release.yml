name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches mod_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          if [ "${{ github.ref_name }}" != "$MOD_VERSION" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match mod_version '$MOD_VERSION' in gradle.properties"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all artifacts
        run: ./gradlew assembleAll

      - name: Collect release jars
        run: |
          mkdir -p release-jars
          find fabric/versions/*/build/libs paper/build/libs \
            -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" \
            -exec cp {} release-jars/ \;
          ls -la release-jars/

      - name: Extract changelog
        id: changelog
        run: |
          CONTENT=$(awk '/^## /{if(p) exit; p=1; next} p' CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: release-jars/*.jar
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

      - name: Publish to Modrinth and CurseForge
        run: ./gradlew :fabric:chiseledPublishMods :paper:publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
